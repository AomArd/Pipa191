name: Build Custom Kernel - Mi Pad 6 (pipa)

on:
  workflow_dispatch:
    inputs:
      SUBLEVEL:
        description: 'Kernel SUBLEVEL (versi spoof)'
        required: true
        default: '191'
        type: choice
        options:
          - '191'
          - '157'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Set up environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 cpio kmod device-tree-compiler

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 \
            https://github.com/crdroidandroid/android_kernel_xiaomi_sm8250 \
            -b 16.0-pipa \
            kernel

      - name: Download Clang Toolchain
        run: |
          mkdir -p clang
          wget -q "https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230628-release/Clang-17.0.0-20230628.tar.gz" -O clang.tar.gz
          tar -xzf clang.tar.gz -C clang
          echo "Clang version:"
          clang/bin/clang --version

      - name: Download GCC Toolchain
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            -b lineage-19.1 gcc64
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            -b lineage-19.1 gcc32

      - name: Spoof Kernel SUBLEVEL
        run: |
          cd kernel
          sed -i "s/^SUBLEVEL = .*/SUBLEVEL = ${{ github.event.inputs.SUBLEVEL }}/" Makefile
          echo "=== Verifikasi Makefile ==="
          grep "^VERSION\|^PATCHLEVEL\|^SUBLEVEL\|^EXTRAVERSION" Makefile

      - name: Disable KernelSU dari source
        run: |
          cd kernel
          if [ -f "drivers/kernelsu/Makefile" ]; then
            echo "# Disabled" > drivers/kernelsu/Makefile
            echo "KernelSU Makefile di-disable"
          fi
          if [ -f "drivers/Makefile" ]; then
            sed -i 's/.*kernelsu.*/# &/' drivers/Makefile
            echo "KernelSU entry di drivers/Makefile di-disable"
          fi

      - name: Fix DTB duplicate label error
        run: |
          cd kernel
          # Fix file qrb5165-iot-rb5.dts yang punya duplicate label fsa4480
          # Device ini bukan pipa, jadi kita hapus saja dari daftar compile
          DTS_FILE="arch/arm64/boot/dts/vendor/qcom/qrb5165-iot-rb5.dts"
          MAKEFILE="arch/arm64/boot/dts/vendor/qcom/Makefile"

          if [ -f "$DTS_FILE" ]; then
            echo "Fixing duplicate label di $DTS_FILE"
            # Hapus salah satu node fsa4480 yang duplikat (node @42)
            # Atau alternatif: hapus file ini dari Makefile compile list
            if [ -f "$MAKEFILE" ]; then
              sed -i '/qrb5165-iot-rb5/d' $MAKEFILE
              echo "qrb5165-iot-rb5.dtb dihapus dari daftar compile"
            fi
          fi

          # Juga set DTC_FLAGS untuk force jika masih ada error DTB lain
          echo "DTC_FLAGS=-f" >> $GITHUB_ENV

      - name: Find and set defconfig
        run: |
          cd kernel
          if [ -f "arch/arm64/configs/vendor/pipa_defconfig" ]; then
            DEFCONFIG="vendor/pipa_defconfig"
          elif [ -f "arch/arm64/configs/pipa_defconfig" ]; then
            DEFCONFIG="pipa_defconfig"
          elif [ -f "arch/arm64/configs/vendor/kona_defconfig" ]; then
            DEFCONFIG="vendor/kona_defconfig"
          elif [ -f "arch/arm64/configs/kona_defconfig" ]; then
            DEFCONFIG="kona_defconfig"
          else
            DEFCONFIG=$(find arch/arm64/configs -maxdepth 2 -name "*defconfig" | head -1 | sed 's|arch/arm64/configs/||')
          fi
          echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV
          echo "Defconfig yang digunakan: $DEFCONFIG"

      - name: Generate .config
        run: |
          export PATH=$(pwd)/clang/bin:$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH
          cd kernel
          mkdir -p ../out
          make O=../out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            ${{ env.DEFCONFIG }}

          # Disable KSU di .config
          cd ../out
          if grep -q "CONFIG_KSU=y" .config 2>/dev/null; then
            sed -i 's/CONFIG_KSU=y/# CONFIG_KSU is not set/' .config
            echo "CONFIG_KSU disabled"
          fi
          if grep -q "CONFIG_KERNELSU=y" .config 2>/dev/null; then
            sed -i 's/CONFIG_KERNELSU=y/# CONFIG_KERNELSU is not set/' .config
            echo "CONFIG_KERNELSU disabled"
          fi

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/clang/bin:$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH
          cd kernel
          set -o pipefail
          make -j$(nproc --all) \
            O=../out \
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            LLVM=1 \
            LLVM_IAS=1 \
            DTC_FLAGS="-f" \
            2>&1 | tee ../build.log

      - name: Show errors from build log
        if: always()
        run: |
          echo "=== ERROR YANG DITEMUKAN ==="
          grep -n "error:\|ERROR:\|fatal:" build.log | head -30 || echo "Tidak ada error"

      - name: Check Build Result
        run: |
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image.gz-dtb" >> $GITHUB_ENV
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
            echo "SUCCESS: Image.gz-dtb"
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image.gz" >> $GITHUB_ENV
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
            echo "SUCCESS: Image.gz"
          elif [ -f "out/arch/arm64/boot/Image" ]; then
            echo "KERNEL_IMAGE=out/arch/arm64/boot/Image" >> $GITHUB_ENV
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
            echo "SUCCESS: Image"
          else
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
            echo "GAGAL - tidak ada kernel image"
            ls out/arch/arm64/boot/ 2>/dev/null || echo "Folder boot tidak ada"
            exit 1
          fi

      - name: Clone AnyKernel3
        if: env.BUILD_SUCCESS == 'true'
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

      - name: Package Kernel
        if: env.BUILD_SUCCESS == 'true'
        run: |
          cp ${{ env.KERNEL_IMAGE }} AnyKernel3/
          if [ -d "out/arch/arm64/boot/dts" ]; then
            find out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} AnyKernel3/ \; 2>/dev/null || true
          fi
          cd AnyKernel3
          DATE=$(date +%Y%m%d)
          ZIP_NAME="CustomKernel-pipa-4.19.${{ github.event.inputs.SUBLEVEL }}-crDroid16-${DATE}.zip"
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          zip -r9 ../${ZIP_NAME} . -x "*.git*"
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
          echo "Berhasil membuat: ${ZIP_NAME}"

      - name: Upload Kernel ZIP
        if: env.BUILD_SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CustomKernel-pipa-4.19.${{ github.event.inputs.SUBLEVEL }}
          path: |
            ${{ env.ZIP_NAME }}
            build.log
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
          
